<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 250px;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
            margin: 0;
            text-align: center;
        }
        .shield { font-size: 36px; margin-bottom: 8px; }
        h3 { margin: 0 0 6px 0; color: #38bdf8; font-size: 16px; }
        p { font-size: 12px; color: #94a3b8; line-height: 1.5; margin: 0; }
        .status-badge {
            background-color: #064e3b;
            color: #34d399;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="shield">🛡️</div>
    <h3>حَصِين للأطفال</h3>
    <p>الحماية الأسرية الذكية نشطة لحماية تصفح طفلك ومنع الإعلانات.</p>
    <div class="status-badge">مفعل ومحمي بنجاح ✅</div>
</body>
</html>
